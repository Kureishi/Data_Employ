[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-employ"
dynamic = ["version"]
description = "Automated end-to-end ML on SQL databases: schema discovery, best-model selection via cross-validation, predictions, and analysis via CLI, Python API, and web dashboard."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Data Employ contributors" }]
keywords = [
    "machine-learning", "sql", "database", "pandas", "scikit-learn",
    "data-science", "automl", "etl", "predictions", "analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "joblib>=1.3",
    "tabulate>=0.9",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
# Multi-process serving on Linux/macOS (see wsgi.py / gunicorn.conf.py in the repo).
gunicorn = ["gunicorn>=21"]

[project.scripts]
data-employ = "ml_agent.cli:main"
data-employ-web = "web_api:main"
# Same as `data-employ`, but skips the auto-dependency-install behavior of main.py.
data-employ-cli = "ml_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Kureishi/Data_Employ"
Repository = "https://github.com/Kureishi/Data_Employ"

[tool.setuptools.dynamic]
version = { attr = "ml_agent.__version__" }

[tool.setuptools]
packages = ["ml_agent"]
py-modules = ["web_api", "main", "wsgi"]

# Ship the zero-dependency dashboard inside the package so `data-employ-web`
# serves it both from a repo checkout and from an installed wheel.
[tool.setuptools.package-data]
ml_agent = ["static/*"]